name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew qualityCheck

  tests:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:jvmTest :testing:jvmTest :app:shared:jvmTest :server:test kotlinStoreYarnLock

  linux-builds:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          ./gradlew
          :app:androidApp:assembleDebug
          :app:desktopApp:packageReleaseDeb
          :app:webApp:composeCompatibilityBrowserDistribution
          :server:buildFatJar
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-package
          path: app/desktopApp/build/compose/binaries/main-release/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-distribution
          path: app/webApp/build/dist/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: server-fat-jar
          path: server/build/libs/server-all.jar
          if-no-files-found: error

  ios-build:
    needs: tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          xcodebuild
          -project app/iosApp/iosApp.xcodeproj
          -scheme iosApp
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
